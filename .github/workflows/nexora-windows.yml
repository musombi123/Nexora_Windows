name: NEXORA Windows Tauri

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nexora-windows.yml"
      - "package.json"
      - "package-lock.json"
      - "src-tauri/**"
      - "README.md"
  pull_request:
    paths:
      - ".github/workflows/nexora-windows.yml"
      - "package.json"
      - "package-lock.json"
      - "src-tauri/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexora-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build NEXORA Studio Pro (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout NEXORA desktop host
        uses: actions/checkout@v4

      - name: Checkout NEXORA workspace source
        uses: actions/checkout@v4
        with:
          repository: musombi123/RevelaCode-Frontend
          ref: main
          path: workspace/frontend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workspace/frontend/package-lock.json

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend workspace dependencies
        run: npm ci
        working-directory: workspace/frontend

      - name: Install Tauri host dependencies
        run: npm ci

      - name: Build NEXORA workspace
        run: npm run build -- --base ./
        working-directory: workspace/frontend/apps/nexora

      - name: Build Tauri Windows installer
        run: npm run tauri:build

      - name: Record source revisions
        shell: pwsh
        run: |
          $frontendSha = git -C workspace/frontend rev-parse HEAD
          @(
            "desktop_repository=${{ github.repository }}"
            "desktop_commit=${{ github.sha }}"
            "frontend_repository=musombi123/RevelaCode-Frontend"
            "frontend_commit=$frontendSha"
            "tauri_version=0.1.1"
            "target=x86_64-pc-windows-msvc"
          ) | Set-Content src-tauri/target/release/bundle/nsis/BUILD-MANIFEST.txt

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: nexora-studio-pro-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/BUILD-MANIFEST.txt
          if-no-files-found: error
          retention-days: 30
